description: Review code changes and fix issues found — loops until the review is clean
# Override with --loop N for a different refinement budget.
loop: 3
until:
  prompt: |-
    First read reviews/review.md. If you cannot read a completed review, return CONTINUE immediately. A passing test or your own inspection cannot substitute for that review.

    Use the review to identify the intended behavior, reviewed revision and required fixes. Compare the reviewed revision with the current working tree, including committed and uncommitted changes. An empty diff against HEAD only describes uncommitted changes. If the report omits a revision, use the available history and files to establish the reviewed scope. Continue if a material change cannot be accounted for.

    For each required fix and each behavior changed since review, check the current implementation against the requirement. When relying on a test, verify that it exercises the disputed behavior. Return SATISFIED when the evidence covers the changes and all required fixes are resolved. Otherwise return CONTINUE. Optional suggestions, praise and edits to the review artifact do not require another pass. Leave the workspace unchanged.
steps:
  - name: review
    command: /code-review
  - name: fix
    prompt: |
      Read the code review file in reviews/review.md that was just generated.

      For each comment and suggestion in the review, do the following:

      1. Assess the comment for accuracy and relevancy. Validate any assumptions it makes — don't blindly accept a review comment as correct.
      2. If the comment identifies a real issue or a genuinely valuable improvement, fix it.
      3. If the comment is wrong, based on a misunderstanding, or would introduce unnecessary complexity, skip it.

      Think critically and objectively. Our goal is to write good, correct software. Follow clean code and clean architecture best practices as well as idiomatic language standards and conventions. Be careful not to introduce complexity unless it provides clear value.

      We aim to write code that is a pleasure to read. We care about how code reads, how code looks, and how code makes you feel when you read it. We value simplicity. We deliberately set a high bar for every code change.
