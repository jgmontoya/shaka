# Shaka — isolated test environments
#
# Usage:
#   docker compose run --rm opencode          # run all checks (typecheck + lint + test)
#   docker compose run --rm opencode bun test # run tests only
#   docker compose run --rm opencode bun run typecheck
#   docker compose run --rm opencode bun run src/index.ts init
#   docker compose run --rm opencode sh       # interactive shell inside container
#   docker compose run --rm claudecode sh     # interactive shell inside container
#
# E2E tests:
#   docker compose run --rm opencode bash test/e2e/opencode.sh
#   docker compose run --rm claudecode bash test/e2e/claudecode.sh
#   docker compose run --rm codex bash test/e2e/codex.sh
#   docker compose run --rm pi bash test/e2e/pi.sh
#
# Auth:
#   CLAUDE_CODE_OAUTH_TOKEN — from root .env (gitignored) for Claude Code LLM tests
#   ~/.codex/auth.json — bind-mounted read-only for Codex LLM tests (from `codex login`)
#   ~/.pi/agent/auth.json — bind-mounted read-only for Pi LLM tests (from `pi /login`)

services:
  opencode:
    build:
      context: .
      dockerfile: dockerfile-opencode
    image: shaka-opencode

  claudecode:
    build:
      context: .
      dockerfile: dockerfile-claudecode
    image: shaka-claudecode
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}

  codex:
    build:
      context: .
      dockerfile: dockerfile-codex
    image: shaka-codex
    volumes:
      # Mount host Codex auth for LLM integration tests (read-only, optional).
      # Long syntax + create_host_path: false so Docker doesn't auto-create
      # the host file as a directory when it's missing — that polluted
      # ~/.codex/ on fresh dev boxes and broke real `codex login` flows.
      # Requires Docker Engine v23+ (API v1.42+); silently ignored on older.
      - type: bind
        source: ${HOME}/.codex/auth.json
        target: /home/shakaUser/.codex/auth.json
        read_only: true
        bind:
          create_host_path: false

  pi:
    build:
      context: .
      dockerfile: dockerfile-pi
    image: shaka-pi
    volumes:
      # Mount host Pi auth for LLM integration tests (read-only, optional).
      # Same long-syntax + create_host_path: false story as codex above —
      # the short form would create a directory at ~/.pi/agent/auth.json
      # and break the real `pi /login` flow.
      - type: bind
        source: ${HOME}/.pi/agent/auth.json
        target: /home/shakaUser/.pi/agent/auth.json
        read_only: true
        bind:
          create_host_path: false
